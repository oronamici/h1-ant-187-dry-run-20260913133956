name: ant PR dry-run containment validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check out pull-request head revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - name: Install checksum-pinned official ant 1.32.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ant_1.32.0_linux_amd64.tar.gz"
          curl -fsSL \
            https://github.com/anthropics/anthropic-cli/releases/download/v1.32.0/ant_1.32.0_linux_amd64.tar.gz \
            -o "$archive"
          echo "b720b674b0d1fb3736207c1998ef2155a9e0c4b54527d2365773205c0d501496  $archive" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/ant-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ant-bin"
          echo "$RUNNER_TEMP/ant-bin" >> "$GITHUB_PATH"

      - name: Start loopback fake Anthropic API
        shell: bash
        run: |
          set -euo pipefail
          H1_REQUEST_LOG="$RUNNER_TEMP/h1-ant-187-requests.jsonl" \
            python3 base/.github/scripts/fake-anthropic-api.py \
            > "$RUNNER_TEMP/h1-ant-187-fake-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/h1-ant-187-fake-api.pid"
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:18787/v1/models?limit=1 >/dev/null && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/h1-ant-187-fake-api.log"
          exit 1

      - name: Create trusted runner-side tool catalog
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/generated-internal-tools.json" <<'JSON'
          [{"type":"custom","name":"internal_deploy_tool","description":"H1_SAFE_TRUSTED_RUNNER_CONFIG_187","input_schema":{"type":"object","properties":{}}}]
          JSON
          chmod 600 "$RUNNER_TEMP/generated-internal-tools.json"
          sha256sum "$RUNNER_TEMP/generated-internal-tools.json"

      - name: Create trusted baseline state using the base revision
        shell: bash
        env:
          ANTHROPIC_API_KEY: h1_dummy_api_key_187
          ANTHROPIC_BASE_URL: http://127.0.0.1:18787
          NO_PROXY: 127.0.0.1,localhost
        run: |
          set -euo pipefail
          cd base
          ant apply --yes ./agents/managed.md
          cp claude-lock.json ../pr/claude-lock.json
          : > "$RUNNER_TEMP/h1-ant-187-requests.jsonl"

      - name: Run the documented PR dry-run against the PR revision
        id: vulnerable
        shell: bash
        env:
          ANTHROPIC_API_KEY: h1_dummy_api_key_187
          ANTHROPIC_BASE_URL: http://127.0.0.1:18787
          NO_PROXY: 127.0.0.1,localhost
        run: |
          set -euo pipefail
          cd pr
          ant apply --dry-run ./agents/managed.md | tee "$RUNNER_TEMP/h1-ant-187-dry-run.log"
          grep -F "H1_SAFE_TRUSTED_RUNNER_CONFIG_187" "$RUNNER_TEMP/h1-ant-187-dry-run.log"

      - name: Emit sanitized validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dry_run_log="$RUNNER_TEMP/h1-ant-187-dry-run.log"
          request_log="$RUNNER_TEMP/h1-ant-187-requests.jsonl"
          marker_seen=false
          if test -f "$dry_run_log" && grep -Fq "H1_SAFE_TRUSTED_RUNNER_CONFIG_187" "$dry_run_log"; then
            marker_seen=true
          fi
          dry_run_post_count=$(grep -c '"method": "POST"' "$request_log" || true)
          jq -n \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg actor "$GITHUB_ACTOR" \
            --arg pr_author "${{ github.event.pull_request.user.login }}" \
            --argjson pr_number "${{ github.event.pull_request.number }}" \
            --argjson marker_seen "$marker_seen" \
            --arg trusted_file "$RUNNER_TEMP/generated-internal-tools.json" \
            --argjson dry_run_post_count "$dry_run_post_count" \
            '{
              event_name: $event_name,
              workflow_actor: $actor,
              pull_request_author: $pr_author,
              pull_request_number: $pr_number,
              official_ant_version: "1.32.0",
              trusted_file_location: $trusted_file,
              trusted_file_outside_checkout: true,
              marker_in_dry_run_log: $marker_seen,
              dry_run_post_count: $dry_run_post_count,
              dry_run_made_no_mutating_api_request: ($dry_run_post_count == 0),
              anthropic_production_requests: 0,
              dummy_api_key_only: true
            }' | tee "$RUNNER_TEMP/runtime-result.json"
